name: tfgit
description: Validate a tfgit secret, load the customer's playbook, run it against a pull request, and comment the output
author: UkrGeeks
inputs:
  tfgit_secret:
    description: Secret used to authenticate with tfgit
    required: true
  service_url:
    description: Base URL of the tfgit service
    required: false
    default: https://tfgit.ukrgeeks.com
  validation_path:
    description: Path on the tfgit service used to validate credentials
    required: false
    default: /api/v1/github-actions/validate
runs:
  using: node20
  main: src/main.js
